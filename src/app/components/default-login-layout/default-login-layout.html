<div class="login-container">
  <div class="login-image-background">
  </div>

  <div class="login-form-overlay">
    <div class="form-wrapper">
      <div class="header">
        <span class="logo">ECONOS</span>
        <p-button label="Cadastrar" icon="pi pi-arrow-right" iconPos="right" routerLink="/cadaster" [rounded]="true "
          variant="outlined" severity="secondary" />
      </div>

      <div class="form-content">
        <h1>Bem-vindo de volta!</h1>
        <p>Faça login para continuar.</p>

        <form (ngSubmit)="submitForm()">
          <p-floatlabel>
            <input pInputText class="p-inputtext p-email-input" id="email" name="email" [(ngModel)]="login.email"
              autocomplete="off" />
            <label class="p-floatlabel-label" for="email">Email</label>
          </p-floatlabel>

          <p-floatlabel>
            <p-password id="password" name="password" [(ngModel)]="login.password" [toggleMask]="true"
              [feedback]="false">
            </p-password>
            <label for="password" class="p-floatlabel-label">Senha</label>
          </p-floatlabel>

          <button pButton type="submit" label="Acessar" severity="info" [fluid]="true">
          </button>
        </form>

        <div class="divider">
          <span>ou</span>
        </div>
        <button pButton type="submit" label="Google" severity="contrast" [fluid]="true">
          <span class="pi pi-google"></span>
        </button>

      </div>
      <span class="ai-icon">Feito por Lucas-Santos732</span>
    </div>
  </div>
</div>
